name: fkiab-fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" > /dev/null 2>&1 || sdkmanager "platforms;android-36" > /dev/null 2>&1 || true

      - name: Native lib
        run: |
          curl -sL -o base.apk "https://github.com/Xposed-Modules-Repo/com.fuck.iab/releases/download/41-1.6.7/app-arm64-v8a-release.apk"
          unzip -o base.apk "lib/arm64-v8a/libnativehook.so" -d tmp
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp tmp/lib/arm64-v8a/libnativehook.so app/src/main/jniLibs/arm64-v8a/
          unzip -o base.apk "assets/scripts/*" -d tmp
          mkdir -p app/src/main/assets/scripts
          cp tmp/assets/scripts/*.js app/src/main/assets/scripts/ 2>/dev/null || true

      - name: Fix
        run: |
          F=app/src/main/java/com/fuck/iab/FakeBinder.kt
          sed -i 's/\r$//' app/build.gradle "$F"
          sed -i 's|// get purchase config bazaar|if (isGoogle) { data.setDataPosition(oldPos); return onTransact(3, data, reply, flags) }\n                    // get purchase config bazaar|' "$F"
          grep -n "onTransact(3" "$F"
          sed -i '/externalNativeBuild {/,/^    }$/d' app/build.gradle
          sed -i '/ndkVersion = /d' app/build.gradle
          sed -i '/^    splits {/,/^    }$/d' app/build.gradle
          grep -c "externalNativeBuild" app/build.gradle || true

      - name: Build
        run: sh gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fkiab-fix-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
