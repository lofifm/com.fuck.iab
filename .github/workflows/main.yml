name: f
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platforms;android-37" >/dev/null 2>&1 || true
      - run: |
          curl -sL -o b.apk https://github.com/Xposed-Modules-Repo/com.fuck.iab/releases/download/41-1.6.7/app-arm64-v8a-release.apk
          unzip -o b.apk "lib/arm64-v8a/libnativehook.so" -d t
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp t/lib/arm64-v8a/libnativehook.so app/src/main/jniLibs/arm64-v8a/
      - run: |
          echo '' | base64 -d > /tmp/p.py
          python3 /tmp/p.py
          sed -i '/distributionSha256Sum/d' gradle/wrapper/gradle-wrapper.properties
      - run: sh gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
